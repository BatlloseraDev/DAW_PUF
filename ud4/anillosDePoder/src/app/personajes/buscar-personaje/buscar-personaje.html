        </table>
    </div>
</div>

<div style="display: flex; justify-content: center; width: 100%;">
    <p-table [value]="personajes" [paginator]="true" [rows]="5" [style]="{ 'width': '75%' }" [tableStyle]="{ 'width': '100%' }" [rowsPerPageOptions]="[5, 10, 20]">
        <ng-template #header>
            <tr>
                <th>Nombre</th>
                <th>Raza</th>
                <th>Fecha Nacimiento</th>
                <th>Nivel Corrupción</th>
                <th>Editar</th>
                <th>Eliminado Lógico</th>
                <th>Eliminado Físico</th>
            </tr>

        </ng-template>
        <ng-template let-personaje #body>
            <tr>
                <td>{{ personaje.nombre }}</td>
                <td>{{ personaje.raza }}</td>
                <td>{{ personaje.fechaNacimiento }}</td>
                <td>{{ personaje.nivelCorrupcion }}</td>
                <td><button (click)="editar(personaje.id)">Editar</button></td>
                <td>
                    @if (personaje.fechaBaja === null) {
                        <app-confirmar-popup [config]="getSoftDeleteConfig(personaje.id)"></app-confirmar-popup>
                    } @else {
                        <app-confirmar-popup [config]="getReactivateConfig(personaje.id)"></app-confirmar-popup>
                    }
                </td>
                <td><app-confirmar-popup [config]="getDeleteConfig(personaje.id)"></app-confirmar-popup></td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="7">No se encontraron personajes</td>
            </tr>
        </ng-template>

    </p-table>
</div>
